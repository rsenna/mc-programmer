[package]
name = "mc-programmer"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Rust library for programming Roland MC-101, MC-707 and MV-1 grooveboxes via MIDI System Exclusive"
license = "MIT"

[lib]
name = "mc_programmer"
path = "src/lib.rs"

# Hardware address-space explorer. Needs a real MIDI link, so it only builds
# with the `midir` feature:
#   cargo run --features midir --bin mc-probe -- ports
[[bin]]
name = "mc-probe"
path = "src/bin/mc-probe.rs"
required-features = ["midir"]

# Frame-level debugging against a real device, so it needs a MIDI link too.
# Without this, plain `cargo test` / `cargo check --all-targets` fails to
# compile on default features.
[[example]]
name = "raw_reply"
path = "examples/raw_reply.rs"
required-features = ["midir"]

[dependencies]
serde_json = "1.0"
parking_lot = "0.12"
tempfile = "3"

[features]
default = []
# Real-hardware MIDI transport built on the cross-platform `midir` crate.
midir = ["dep:midir"]

[dependencies.midir]
version = "0.10"
optional = true
